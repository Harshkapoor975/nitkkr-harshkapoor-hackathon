version: '3.8'

services:
  # The Presentation Layer (Frontend)
  dashboard:
    build: .
    container_name: risk_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    restart: unless-stopped

  # The Background Crawler (Backend)
  daemon:
    build: .
    container_name: risk_daemon
    volumes:
      - ./data:/app/data
    command: python scripts/live_risk_daemon.py
    restart: unless-stopped
    depends_on:
      - dashboard
